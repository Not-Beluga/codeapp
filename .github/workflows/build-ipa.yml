name: Build CodeApp IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Download Frameworks
        run: |
          chmod +x ./downloadFrameworks.sh
          ./downloadFrameworks.sh

      - name: Verify Frameworks Download
        run: |
          echo "=== 檢查下載返黎嘅運行庫 / Frameworks ==="
          ls -la
          
          # 檢查是否有成功下載任何 .framework 或相關 runtime 檔案
          FRAMEWORK_COUNT=$(find . -name "*.framework" | wc -l)
          echo "偵測到嘅 .framework 數量: $FRAMEWORK_COUNT"
          find . -name "*.framework" || true
          
          if [ "$FRAMEWORK_COUNT" -eq 0 ]; then
            echo "❌ 警告：搵唔到任何 .framework 檔案！nodejs-mobile 或相關 runtime 可能未成功下載。"
            # 如果你發覺即使冇 framework 都要硬行 build，可以暫時移除下面呢行 exit 1
            exit 1
          else
            echo "✅ 驗證成功：成功檢測到所需的 Framework 檔案！"
          fi

      - name: Auto Generate Shared Scheme
        run: |
          sudo gem install xcodeproj
          ruby -e "
            require 'xcodeproj'
            proj_path = 'Code.xcodeproj'
            project = Xcodeproj::Project.open(proj_path)
            target = project.targets.find { |t| t.name == 'Code' } || project.targets.first
            scheme = Xcodeproj::XCScheme.new
            scheme.add_build_target(target)
            scheme.save_as(proj_path, 'Code', true)
            puts 'Successfully created Scheme: Code.xcscheme'
          "

      - name: Inject Stub AppIcon Set
        run: |
          # Locate Assets.xcassets directory and create Iconv2 stub
          ASSET_PATH=$(find . -name "Assets.xcassets" -type d | head -n 1)
          ICON_DIR="$ASSET_PATH/Iconv2.appiconset"
          mkdir -p "$ICON_DIR"
          
          cat << 'EOF' > "$ICON_DIR/Contents.json"
          {
            "images" : [
              { "idiom" : "iphone", "size" : "60x60", "scale" : "2x" },
              { "idiom" : "iphone", "size" : "60x60", "scale" : "3x" },
              { "idiom" : "ios-marketing", "size" : "1024x1024", "scale" : "1x" }
            ],
            "info" : { "version" : 1, "author" : "xcode" }
          }
          EOF
          echo "Created stub Iconv2 asset at $ICON_DIR"

      - name: Build Archive
        run: |
          xcodebuild archive \
            -project Code.xcodeproj \
            -scheme Code \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath build/CodeApp.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -r build/CodeApp.xcarchive/Products/Applications/*.app build/Payload/
          cd build
          zip -r CodeApp.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodeApp-Unsigned-IPA
          path: build/CodeApp.ipa
