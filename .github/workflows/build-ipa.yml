name: Build CodeApp IPA (Ultra-Safe)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Download Frameworks
        run: |
          chmod +x ./downloadFrameworks.sh
          ./downloadFrameworks.sh

      - name: Safety Check 1 - Verify Node & Critical Frameworks
        run: |
          echo "=== 正在驗證 ARM64 核心 Frameworks ==="
          NODE_FW=$(find . -path "*/ios-arm64/NodeMobile.framework" -o -path "*/ios-arm64_arm64e/NodeMobile.framework" | head -n 1)
          
          if [ -z "$NODE_FW" ]; then
            echo "❌ 嚴重錯誤：搵唔到適用於 iOS Device (arm64) 嘅 NodeMobile.framework！"
            exit 1
          else
            echo "✅ 成功找到 Node 核心框架: $NODE_FW"
          fi

      - name: Auto Generate Shared Scheme
        run: |
          sudo gem install xcodeproj
          ruby -e "
            require 'xcodeproj'
            proj_path = 'Code.xcodeproj'
            project = Xcodeproj::Project.open(proj_path)
            target = project.targets.find { |t| t.name == 'Code' } || project.targets.first
            scheme = Xcodeproj::XCScheme.new
            scheme.add_build_target(target)
            scheme.save_as(proj_path, 'Code', true)
            puts 'Successfully created Scheme: Code.xcscheme'
          "

      - name: Inject Stub AppIcon Set
        run: |
          ASSET_PATH=$(find . -name "Assets.xcassets" -type d | head -n 1)
          ICON_DIR="$ASSET_PATH/Iconv2.appiconset"
          mkdir -p "$ICON_DIR"
          
          cat << 'EOF' > "$ICON_DIR/Contents.json"
          {
            "images" : [
              { "idiom" : "iphone", "size" : "60x60", "scale" : "2x" },
              { "idiom" : "iphone", "size" : "60x60", "scale" : "3x" },
              { "idiom" : "ios-marketing", "size" : "1024x1024", "scale" : "1x" }
            ],
            "info" : { "version" : 1, "author" : "xcode" }
          }
          EOF
          echo "Created stub Iconv2 asset at $ICON_DIR"

      - name: Build Archive
        run: |
          xcodebuild archive \
            -project Code.xcodeproj \
            -scheme Code \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath build/CodeApp.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_IDENTITY=""

      - name: Safety Check 2 - Force Embed All Frameworks into App Bundle
        run: |
          APP_PATH=$(find build/CodeApp.xcarchive/Products/Applications -name "*.app" | head -n 1)
          echo "目標 App Bundle 路徑: $APP_PATH"
          
          FRAMEWORKS_DIR="$APP_PATH/Frameworks"
          mkdir -p "$FRAMEWORKS_DIR"

          echo "=== 開始強制注入 NodeMobile.framework 及所有關聯庫 ==="
          
          # 1. 強制複製真機版 NodeMobile.framework 到 Frameworks/
          NODE_SRC=$(find ./Resources -name "NodeMobile.framework" | grep "ios-arm64" | grep -v "simulator" | head -n 1)
          if [ -n "$NODE_SRC" ]; then
            echo "複製 NodeMobile.framework 來自: $NODE_SRC"
            cp -R "$NODE_SRC" "$FRAMEWORKS_DIR/"
          else
            echo "❌ 找不到原生 arm64 NodeMobile.framework！"
            exit 1
          fi

          # 2. 強制嵌入所有 Resources 下的 ios-arm64 Frameworks
          find ./Resources -name "*.framework" | grep "ios-arm64" | grep -v "simulator" | grep -v "maccatalyst" | while read -r fw; do
            fw_name=$(basename "$fw")
            if [ ! -d "$FRAMEWORKS_DIR/$fw_name" ]; then
              cp -R "$fw" "$FRAMEWORKS_DIR/"
              echo "已補全嵌入框架: $fw_name"
            fi
          done

          # 3. 同步 NodeJS 資源，但不包含原始 xcframework 資料夾
          if [ -d "./Resources/NodeJS" ]; then
            cp -R ./Resources/NodeJS "$APP_PATH/"
            echo "已同步 NodeJS 資源目錄進 App Bundle"
          fi

      # 【關鍵修復】清理所有導致簽名失敗嘅垃圾檔及 dSYM
      - name: Clean Sign-Blocking Artifacts (dSYMs, Simulator Slices, XCFrameworks)
        run: |
          APP_PATH=$(find build/CodeApp.xcarchive/Products/Applications -name "*.app" | head -n 1)
          echo "=== 開始清理會干擾簽名嘅檔案 ==="
          
          # 刪除 App Bundle 內殘留嘅 raw .xcframework 資料夾
          find "$APP_PATH" -name "*.xcframework" -exec rm -rf {} + || true
          
          # 刪除所有 .dSYM 檔
          find "$APP_PATH" -name "*.dSYM" -exec rm -rf {} + || true
          
          # 刪除所有包含 simulator 嘅架構檔
          find "$APP_PATH" -name "*simulator*" -exec rm -rf {} + || true
          
          # 刪除 macOS 系統垃圾檔
          find "$APP_PATH" -name "__MACOSX" -exec rm -rf {} + || true
          find "$APP_PATH" -name ".DS_Store" -exec rm -rf {} + || true
          
          echo "✅ 清理完畢！"

      - name: Safety Check 3 - Final IPA Payload Audit
        run: |
          APP_PATH=$(find build/CodeApp.xcarchive/Products/Applications -name "*.app" | head -n 1)
          TARGET_NODE_FW="$APP_PATH/Frameworks/NodeMobile.framework"
          
          echo "=== 執行最終 App 內容物清查 ==="
          ls -la "$APP_PATH/Frameworks"
          
          if [ -d "$TARGET_NODE_FW" ]; then
            echo "✅ 【驗證通過】NodeMobile.framework 已確實存於 $TARGET_NODE_FW"
            lipo -info "$TARGET_NODE_FW/NodeMobile" || true
          else
            echo "❌ 【驗證失敗】App Bundle 內依然缺失 NodeMobile.framework！"
            exit 1
          fi

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -r build/CodeApp.xcarchive/Products/Applications/*.app build/Payload/
          cd build
          zip -r CodeApp.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodeApp-Unsigned-IPA
          path: build/CodeApp.ipa
