name: Build CodeApp IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Download Frameworks
        run: |
          chmod +x ./downloadFrameworks.sh
          ./downloadFrameworks.sh

      - name: Autocreate Xcode Schemes
        run: |
          # 強制 Xcode 為專案自動建立 Shared Schemes，避免 Scheme 遺失
          xcodebuild -autocreateSchemes -project Code.xcodeproj
          # 列出所有可用的 Scheme 方便在 Log 查看
          xcodebuild -list -project Code.xcodeproj

      - name: Build Unsigned IPA
        run: |
          mkdir -p build/Build/Products/Release-iphoneos/Payload
          
          # 自動抓取 project 裡面第一個可用的 scheme 名稱進行編譯
          SCHEME_NAME=$(xcodebuild -list -project Code.xcodeproj | awk '/Schemes:/{flag=1; next} /^[[:space:]]*$/{flag=0} flag' | head -n 1 | xargs)
          echo "Detected Scheme: $SCHEME_NAME"

          xcodebuild archive \
            -project Code.xcodeproj \
            -scheme "$SCHEME_NAME" \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath build/CodeApp.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

          cp -r build/CodeApp.xcarchive/Products/Applications/*.app build/Build/Products/Release-iphoneos/Payload/
          cd build/Build/Products/Release-iphoneos/
          zip -r CodeApp.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodeApp-Unsigned-IPA
          path: build/Build/Products/Release-iphoneos/CodeApp.ipa
