name: Build CodeApp IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Download Frameworks
        run: |
          chmod +x ./downloadFrameworks.sh
          ./downloadFrameworks.sh

      - name: Build Unsigned IPA
        run: |
          mkdir -p build/Build/Products/Release-iphoneos/Payload
          
          xcodebuild archive \
            -project Code.xcodeproj \
            -scheme Code \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/CodeApp.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

          cp -r build/CodeApp.xcarchive/Products/Applications/Code.app build/Build/Products/Release-iphoneos/Payload/
          cd build/Build/Products/Release-iphoneos/
          zip -r CodeApp.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodeApp-Unsigned-IPA
          path: build/Build/Products/Release-iphoneos/CodeApp.ipa
