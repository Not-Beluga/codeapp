name: Build CodeApp IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Download Frameworks
        run: |
          chmod +x ./downloadFrameworks.sh
          ./downloadFrameworks.sh

      - name: Build App Bundle (.app)
        run: |
          # 1. 自動獲取專案內第一個 Target 名稱 (使用 Target 替代 Scheme)
          TARGET_NAME=$(xcodebuild -list -project Code.xcodeproj | awk '/Targets:/{flag=1; next} /Build Configurations:/{flag=0} flag' | head -n 1 | xargs)
          echo "Target 名稱: $TARGET_NAME"

          # 2. 使用 -target 直接 Compile，完全不需要 Scheme
          xcodebuild build \
            -project Code.xcodeproj \
            -target "$TARGET_NAME" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath ./build_output \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_IDENTITY=""

      - name: Package IPA
        run: |
          # 建立標準 IPA 結構
          mkdir -p Payload

          # 尋找產生的 .app 目錄並複製入 Payload
          APP_PATH=$(find ./build_output -name "*.app" -type d | head -n 1)
          echo "找到 App 目錄: $APP_PATH"
          
          cp -R "$APP_PATH" Payload/

          # 壓縮為 CodeApp.ipa
          zip -r CodeApp.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodeApp-Unsigned-IPA
          path: CodeApp.ipa
